<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Charts</title>
	<link rel="stylesheet" href="styles.css">
	<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" defer></script>
	<script src="load-data.js" defer></script>
	<script src="charts/bar.js" defer></script>
	<script src="charts/donut.js" defer></script>
	<script src="charts/line.js" defer></script>
	<script src="charts/scatter.js" defer></script>
</head>
<body>
	<main class="charts">
		<section class="chart-panel">
			<h2>Bar Chart</h2>
			<div id="bar-chart" class="chart" aria-label="Bar chart"></div>
		</section>
		<section class="chart-panel">
			<h2>Donut Chart</h2>
			<div id="donut-chart" class="chart" aria-label="Donut chart"></div>
		</section>
		<section class="chart-panel">
			<h2>Line Chart</h2>
			<div id="line-chart" class="chart" aria-label="Line chart"></div>
		</section>
		<section class="chart-panel">
			<h2>Scatter Plot</h2>
			<div id="scatter-chart" class="chart" aria-label="Scatter plot"></div>
		</section>
	</main>
</body>
</html>
